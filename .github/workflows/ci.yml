name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # Guards the published resume PDF against re-introducing a phone number.
      # Needs a real PDF text extractor; see scripts/check-resume.mjs.
      - name: Install PDF text extractor
        run: |
          # Runners ship a Google Chrome apt source that intermittently serves an
          # index with a hash-sum mismatch, which fails `apt-get update` with exit
          # 100 and takes unrelated installs down with it. Match by content, not
          # filename: Ubuntu 24.04 uses the deb822 *.sources format, so removing
          # only google-chrome.list silently leaves the source in place.
          sudo grep -rlE 'dl\.google\.com|google-chrome' \
            /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -vf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          # check:resume refuses to pass without this tool when CI is set, so a
          # silent failure here cannot degrade the guard into a no-op.
          pdftotext -v
      - run: npm run check:resume

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `playwright install --with-deps` shells out to apt, so it hits the same
      # broken Google Chrome source as the checks job and aborts with exit 100.
      - name: Drop the runner's Google Chrome apt source
        run: |
          # Runners ship a Google Chrome apt source that intermittently serves an
          # index with a hash-sum mismatch, which fails `apt-get update` with exit
          # 100 and takes unrelated installs down with it. Match by content, not
          # filename: Ubuntu 24.04 uses the deb822 *.sources format, so removing
          # only google-chrome.list silently leaves the source in place.
          sudo grep -rlE 'dl\.google\.com|google-chrome' \
            /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -vf
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
